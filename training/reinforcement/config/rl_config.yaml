global:
  total_cycles: 10
  best_model_save_interval: 5
  buffer_file_path: /Users/User/Projects/talbot/training/reinforcement/rl_cycles/circular_buffer.hdf5
  buffer_positions_total: 500000
  self_play_positions_per_cycle: 50000
  self_play_save_interval: 10000
  eval_games: 100
  eval_cutoff: 0.55

model:
  best_model_path: "/Users/User/Projects/talbot/training/reinforcement/best_models/best_model.pth"
  input_planes: 68
  filters: 128
  resblocks: 20

data_generation:
  selection_workers: 1
  update_workers: 4
  batch_size: 16
  cpuct: 3.0
  search_depth: [308, 800]
  search_depth_weights: [0.75, 0.25]
  virtual_loss: 0.1
  value_transition_factor: 0.5
  value_max_transition_move: 40
  value_transition_steepness: 0.1
  opening_book_path: "/Users/User/Projects/talbot/data/opening_books/Titans.bin"
  opening_min_moves: 8
  opening_max_moves: 12
  temperature_threshold_move: 25
  temperature_high: 0.6
  temperature_low: 0
  dirichlet_alpha: 0.25
  dirichlet_epsilon: 0.2
  early_cutoff_simulations: 100
  early_cutoff_threshold: 0.7
  main_logging_level: 20
  worker_logging_level: 50

training:
  batch_size: 512
  epochs: 20
  policy_loss_weight: 1.0
  value_loss_weight: 1.0
  log_interval: 10
  validation_split: 0.10
  weight_decay: 1e-4
  cosine_eta_max: 1e-3
  cosine_eta_min: 1e-5
  dropout_rate_conv: 0.1
  dropout_rate_fc: 0.25
  dropout_conv_start_block: 10
  main_logging_level: 20

evaluation:
  selection_workers: 1
  update_workers: 4
  batch_size: 16
  cpuct: 3.0
  search_depth: [308]
  search_depth_weights: [1.0]
  virtual_loss: 0.1
  value_transition_factor: 0
  value_max_transition_move: 0
  value_transition_steepness: 0
  opening_book_path: "/Users/User/Projects/talbot/data/opening_books/Titans.bin"
  opening_min_moves: 8
  opening_max_moves: 12
  temperature_threshold_move: 0
  temperature_high: 0
  temperature_low: 0
  dirichlet_alpha: 0.0001
  dirichlet_epsilon: 0.0001
  early_cutoff_simulations: 100
  early_cutoff_threshold: 0.7
  main_logging_level: 20
  worker_logging_level: 20