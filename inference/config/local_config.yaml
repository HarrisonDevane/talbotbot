game:
  white_player: 'talbot'
  black_player: 'human'
  initial_fen: Null
  white_perspective: True

model:
  model_path: 'training/reinforcement/rl_cycles/best_models/best_model.pth'
  input_planes: 69
  filters: 128
  resblocks: 16

evaluation:
  training: True                                     # Mode flag (True = add noise/exploration, False = deterministic eval)
  inference_worker_cores:                            # Dedicated CPU cores for the Batching Process (feeding the GPU)
    - [12, 13, 14, 15]
  batch_size_per_worker: 16                          # Max positions a single worker sends at once
  batch_size_factor: 10                              # Multiplier to determine max GPU batch size (Workers * Batch * Factor)
  batch_timeout: 0.001                               # How long the GPU batcher waits for more data before running partial batch
  cpuct: 1.75                                        # PUCT Exploration constant (Standard AlphaZero: 1.0 - 2.5)
  search_depth: 128                                  # MCTS Simulations per move
  virtual_loss: 0.3                                  # Penalty applied to nodes currently being explored (prevents threads flocking)
  gumbel_sigma: 50.0                                 # Sigma used for gumbel score calucation
  gumbel_norm_floor: 0.1                             # Floor for gumbell relative normalization
  gumbel_visit_scaling: 1.0                          # Scale for sigma with visit count
  gumbel_noise: 1.0                                  # Gumbel noise value
  gumbel_early_k: 4                                  # k top moves early game
  gumbel_early_cutoff: 2                             # Early cutoff move
  gumbel_mid_k: 16                                   # k top moves mid game
  gumbel_mid_cutoff: 10                              # Mid cutoff move
  gumbel_late_k: 16                                  # Rest of game k
  draw_cutoff: -0.5                                  # Value threshold to consider a game a draw (minimax)
  resignation_probability: 0.9                       # Chance the bot checks for resignation allowed
  resignation_cutoff: -0.95                          # Bot resigns to save compute time
  main_logging_level: 20                             # INFO level
  worker_logging_level: 20                           # CRITICAL only (only keeps PGN)
  inference_logging_level: 20                        # INFO level