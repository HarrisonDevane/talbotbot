config_file: 'config/play_local_tournament.yaml'                              # Base tournament config (200 games per pairing)

tournament:
  schedule: gauntlet                                                          # every player vs baseline only
  baseline: hybrid_c1.4_t1.0                                                  # Reference cell; Elo anchor (0)
  search_depths: [1000, 4000, 16000]                                          # Fixed nodes per move; one independent tournament per depth
  fixed_overrides: [mcts.search=hybrid, mcts.tree_reuse=false, mcts.gumbel.m=16, mcts.gumbel.sigma_cap=30, mcts.gumbel.noise=0]   # Gumbel MuZero-style: SH root (m=16, training value) + PUCT below; no reuse; cap 30; deterministic root

players:
  - name: hybrid_c1.4_t1.0                                                    # reference
    checkpoint: '/app/train_dir/models/checkpoints/step_100000_model.pth'
    overrides: [mcts.puct.cpuct=1.4, mcts.policy_softmax_temp=1.0]
  - name: hybrid_c1.0_t0.7
    checkpoint: '/app/train_dir/models/checkpoints/step_100000_model.pth'
    overrides: [mcts.puct.cpuct=1.0, mcts.policy_softmax_temp=0.7]
  - name: hybrid_c1.4_t0.7
    checkpoint: '/app/train_dir/models/checkpoints/step_100000_model.pth'
    overrides: [mcts.puct.cpuct=1.4, mcts.policy_softmax_temp=0.7]
  - name: hybrid_c2.0_t0.7
    checkpoint: '/app/train_dir/models/checkpoints/step_100000_model.pth'
    overrides: [mcts.puct.cpuct=2.0, mcts.policy_softmax_temp=0.7]
  - name: hybrid_c3.0_t0.7
    checkpoint: '/app/train_dir/models/checkpoints/step_100000_model.pth'
    overrides: [mcts.puct.cpuct=3.0, mcts.policy_softmax_temp=0.7]
