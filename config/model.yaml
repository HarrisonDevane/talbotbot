model:
  filters: 224                                                    # Number of convolutional filters in residual blocks
  bottleneck_channels: 112                                        # Number of channels for bottleneck layers
  resblocks: 20                                                   # Total number of residual blocks in the network (including broadcasting blocks)
  broadcast_interval: 8                                           # Interval for global broadcasting block

chess:
  board_dim: 8                                                    # Spatial dimension of the chess board (8x8)
  policy_channels: 73                                             # Number of output channels for the policy head
  total_policy_moves: 4672                                        # Total possible discrete moves in the action space
  input_planes: 69                                                # Number of input feature planes representing the state