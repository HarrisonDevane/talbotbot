config_file: 'config/play_local_tournament.yaml'                              # Base tournament config (200 games per pairing; global.search_stats: false)

tournament:
  schedule: round_robin                                                       # every pair: 22 players -> 231 pairings
  baseline: step_005k                                                         # Elo anchor (0): first checkpoint
  search_depths: [1000]                                                       # 1k new sims per move (1k-tuned PUCT settings)
  fixed_overrides: [mcts.tree_reuse=true, mcts.puct.cpuct=1.0, mcts.policy_softmax_temp=1.4]   # best 1k PUCT cell; reuse on (policy-only ignores these)

players:
  - name: step_000k
    checkpoint: '/app/train_dir/models/checkpoints/step_000000_model.pth'
    overrides: [mcts.search=puct]
