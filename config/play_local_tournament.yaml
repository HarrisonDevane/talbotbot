global:
  model_file: '/app/config/model.yaml'                           # Model architecture config (C++ reads input_planes; default arch for ONNX export)
  log_dir: '/app/logs/local_tournament'                          # Every run goes in <log_dir>/<spec name>_<timestamp>/; ONNX cache in <log_dir>/onnx_cache/
  exe_path: '/app/build/talbot_tournament'                       # Compiled tournament binary (talbot_trt_compile must be in the same folder)
  ordo_path: '/app/data/Ordo/ordo'                               # Ordo binary used to rate each run
  search_stats: false
  main_logging_level: 50                                         # Logging level for the C++ tournament's main log

inference:
  batch_size: 128                                                # Max batch size during inference (per batcher)
  batch_size_factor: 8                                           # Multiplier for batch size to determine max slots
  batch_timeout_ms: 10                                           # How long each GPU batcher waits
  logging_interval_sec: 10                                       # Interval for system metrics logging
  logging_level: 20                                              # Logging level for the Batcher Diagnostics

mcts:
  search: deficit                                                 # deficit | halving | puct
  search_depth: 1000                                              # Fixed node budget when UCI gives no time (and for the first two plies)
  tree_reuse: true                                                # Reuse the previous move's subtree (deficit/puct; halving always starts fresh)
  worker_minibatch_size: 64                                      # Max positions sent to the batcher at once
  virtual_loss: 0.3                                               # Penalty applied to nodes currently being explored
  contempt: 0.0                                                   # Contempt for playing drawing positions
  policy_softmax_temp: 1.4                                        # Temperature on the policy logits (prior sharpness)
  early_stop_q_gap: 1.0                                           # Stop early when the top two root moves differ by this much Q (0 = off)
  early_stop_min_visits: 100000                                   # Minimum root visits before early stop may trigger
  early_return_on_forced_win: true                                # Return immediately when a forced win is proven
  gumbel:                                                         # deficit + halving only
    c_visit: 50.0                                                 # sigma = (c_visit + min(max_visits, sigma_cap)) * c_scale
    c_scale: 1.0                                                  # Sigma multiplicative gain
    sigma_cap: 30.0                                               # Cap on max_visits inside sigma
    noise: 0.0                                                    # Gumbel noise at the root (0 = deterministic)
    explore_c: 0.0                                                # Exploration bonus coefficient, same at every depth (0 = none)
    m: 64                                                         # Root candidates for sequential halving (halving only)
  puct:                                                           # puct only
    cpuct: 1.5                                                    # Exploration constant, Q on [-1, 1]
    fpu_reduction: 0.0                                            # Value for unvisited moves = v_mix - this

pool_sizing:
  avg_branching: 35.0                                             # Avg legal moves per chess position
  node_safety_factor: 8.0                                         # Slack over predicted sims for node count
  edge_safety_factor: 12.0                                         # Slack over (sims * branching) for edge count
  node_hard_cap_mb: 200                                           # Per-worker, per-side MCTSNode pool ceiling (~1.9M nodes @ 56B)
  edge_hard_cap_mb: 400                                           # Per-worker, per-side MCTSEdge pool ceiling (~9.8M edges @ 16B)

selection:
  temperature_ply_cutoff: 0                                      # Sample proportional to visit count for first moves (0 = always deterministic)
  temperature_q_decay: 0.0                                       # Absolute Q value [-1, 1] Boltzmann temperature decay
  draw_cutoff: 0.0                                               # Value threshold to consider a game a draw
  draw_min_visit_share: 0.25                                     # Draw-line vs best move: each needs >= this share of the leader's visits for Q vs draw_cutoff to decide; else the better-visited one wins
  resignation_probability: 0.0                                   # Chance the bot checks for resignation allowed
  resignation_cutoff: 0.0                                        # Value head cutoff for resignation

tournament:
  workers_per_core: 1                                           # Number of game workers to pin to each core
  games_per_match: 200                                          # Total games per pairing (must be even; each opening played twice)
  opening_file: '/app/data/opening_pgn/8moves_v3_tune.pgn'      # Path to the PGN file of opening lines
  opening_plies: 8                                              # Use only the first N plies of each book line (0 = full line); duplicates after truncation are dropped
  max_ply_length: 400                                           # Hard cutoff in half-moves before a game is forced drawn
  worker_logging_level: 50                                      # Logging level for MCTS game worker: 20 = per move analysis, 50 = only PGN

core_pinning:
  main: [3]                                                     # Dedicated CPU cores for the main C++ orchestrator
  batcher_a: [13, 14, 15]                                       # Dedicated CPU cores for side A's TensorRT batcher
  batcher_b: [16, 17, 18]                                       # Dedicated CPU cores for side B's TensorRT batcher
  game_worker: [11,12,19,20,21,22,23,24,25,26]                  # Dedicated CPU cores for concurrent game execution