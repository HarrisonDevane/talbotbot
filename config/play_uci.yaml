global:
  model_file: 'D:/Projects/talbot/config/model.yaml'              # Path to the secondary architecture config
  model_path: 'D:/Projects/talbot/train_dir/models/model'         # Path to best model base name
  log_dir: 'D:/Projects/talbot/logs/local_inference'              # Directory for all engine logs
  main_logging_level: 20                                          # Logging level for the UCI Orchestrator

evaluation:
  main_cores: [3]                                                 # Dedicated CPU cores for the main C++ orchestrator
  game_worker_cores: [5, 6, 7, 8]                                 # Dedicated CPU cores for games

inference:
  inference_worker_cores: [13, 14, 15]                            # Dedicated CPU cores for the Batching Process (dispatcher, collector, filler)
  batch_size: 64                                                  # Max batch size during inference
  batch_size_factor: 32                                            # Multiplier for batch size to determine max slots
  batch_timeout_ms: 10                                            # How long the GPU batcher waits
  logging_interval_sec: 10                                        # Interval for system metrics logging
  logging_level: 20                                               # Logging level for the Batcher Diagnostics

mcts:
  node_pool_size: 25000000                                        # Capacity of the persistent MCTS node pool
  worker_minibatch_size: 64                                       # Max positions sent to batcher at once
  virtual_loss: 0.3                                               # Penalty applied to nodes currently being explored
  contempt: 0.0                                                  # Contempt for playing drawing positions
  cpuct: 1.75
  two_fold_repetition: true
  gumbel_c_visit: 50.0                                            # Sigma used for gumbel score calculation
  gumbel_c_scale: 1.0                                             # Scale for sigma with visit count
  gumbel_noise: 0.0                                               # 0.0 for deterministic tournament play
  gumbel_search_depth: 1000                                       # Fallback node budget when UCI gives no time (go infinite / go / nodes)
  gumbel_m: 64                                                    # m value for sequential halving
  
selection:
  temperature_ply_cutoff: 0                                      # Sample proportional to visit count for first moves
  temperature_q_decay: 0.05                                       # Absolute Q value [-1, 1] Boltzmann temperature decay
  draw_cutoff: 0.1                                                # Value threshold to consider a game a draw
  resignation_probability: 0.0                                    # Chance the bot checks for resignation allowed
  resignation_cutoff: 0.0                                         # Value head cutoff for resignation

time_control:
  move_horizon: 30.0                                              # Assumed moves left when UCI gives no movestogo (lower = more time per move)
  increment_fraction: 0.90                                        # Fraction of increment folded into the move (refunded each move, so safe to spend)
  base_fraction: 1.00                                             # Global scale on base allocation (<1 conservative, >1 aggressive)
  hard_multiplier: 3.0                                            # Hard limit = target * this (lets a critical move overspend, capped below)
  max_time_fraction: 0.80                                         # Never allocate more than this fraction of remaining time (anti-flag backstop)
  move_overhead_ms: 100                                           # Lag reserve subtracted from clock; raise for Lichess (~300-500). Safety, not strategy
  min_think_ms: 10                                                # Floor so we never emit a 0ms move in time scramble
  nps_ewma_alpha: 0.40                                            # Smoothing for trailing nodes/sec estimate (higher = tracks recent moves faster)
  nps_ewma_default: 25000                                         # Default NPS for first move in non-starting positions

tablebase:
  enabled: true
  path: 'D:/Projects/talbot/data/syzygy/345'